# Test cases for the PQC extension: one instruction, KECCAKF.
#
# The vehicle is tests/pqc/keccak_pe, and it is deliberately NOT keccak_sg5.
# sg5 has no warp axis -- its -t is lanes inside one warp -- so its twenty
# ordering probes cannot reach the hazard that actually bit: a caller's store
# still travelling when the engine reads. That one only appears above one warp.
# keccak_pe takes -b as well as -t, and its loop runs both boundaries per
# permutation (a CPU store immediately before the instruction, a full read-back
# immediately after), so a regression on either side fails here.
#
# keccak_pe also needs no build-arm variable: the kernel always issues the
# instruction. That matters -- an arm selected by a make variable can be
# silently dropped by a stale copied Makefile, which is how a PE column once
# came back identical to its own baseline and read like a result.
category: pqc
defaults:
  xlen:
  - 32
  tier: smoke
  configs: "-DVX_CFG_EXT_PQC_ENABLE"
  touches: [hw/rtl/pqc, sim/simx/pqc, sw/kernel/include/pqc, tests/pqc]
tests:
# --- functional, both drivers -------------------------------------------
- id: keccak_pe-1warp
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: pqc/keccak_pe
  args: -b 1 -t 1 -p 4
- id: keccak_pe-4warp
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: pqc/keccak_pe
  args: -b 4 -t 1 -p 4
# The multi-warp acquire case. With the guard removed this is the test that
# fails (bad=50 at four warps, two whole states of four); one and two warps
# still pass, which is exactly why a single-warp suite could not have caught it.
- id: keccak_pe-8warp
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: pqc/keccak_pe
  configs: -DVX_CFG_EXT_PQC_ENABLE -DVX_CFG_NUM_WARPS=8
  args: -b 8 -t 1 -p 4
# Multi-lane within a warp: the engine serves a trace's active lanes serially.
- id: keccak_pe-4lane
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: pqc/keccak_pe
  args: -b 1 -t 4 -p 4

# Multi-warp AND multi-lane together. The two axes were covered separately and
# their combination was not; a per-lane sequencer bug that only shows when
# several warps are also queued would have sat in the gap between them.
- id: keccak_pe-4warp4lane
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: pqc/keccak_pe
  args: -b 4 -t 4 -p 4

# --- the configuration the paper actually evaluates ---------------------
# 8 warps x 32 threads. Everything above runs at the 4-thread default, so the
# 32-lane path -- where NUM_LSU_LANES is 32 and the 50-word state becomes two
# beats of 32 and 18 instead of thirteen of four -- was exercised only by hand.
- id: keccak_pe-target-1x1
  via: blackbox
  drivers: [simx, rtlsim]
  app: pqc/keccak_pe
  configs: -DVX_CFG_EXT_PQC_ENABLE -DVX_CFG_NUM_WARPS=8 -DVX_CFG_NUM_THREADS=32
  args: -b 1 -t 1 -p 4
- id: keccak_pe-target-1x32
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: pqc/keccak_pe
  configs: -DVX_CFG_EXT_PQC_ENABLE -DVX_CFG_NUM_WARPS=8 -DVX_CFG_NUM_THREADS=32
  args: -b 1 -t 32 -p 4
- id: keccak_pe-target-8x1
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: pqc/keccak_pe
  configs: -DVX_CFG_EXT_PQC_ENABLE -DVX_CFG_NUM_WARPS=8 -DVX_CFG_NUM_THREADS=32
  args: -b 8 -t 1 -p 4
- id: keccak_pe-target-8x32
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: pqc/keccak_pe
  configs: -DVX_CFG_EXT_PQC_ENABLE -DVX_CFG_NUM_WARPS=8 -DVX_CFG_NUM_THREADS=32
  args: -b 8 -t 32 -p 4

# --- configurations the static review found broken, now regressions ----
# Each of these failed before its fix, and the failure is recorded next to it so
# a future reader can tell a real regression from a flaky run.
#
# Multi-pass. With SIMD_WIDTH < NUM_THREADS one KECCAKF arrives as several
# passes; the engine unlocked the warp on the FIRST one, letting the caller's
# next load run while later lanes were still unpermuted. Pre-fix: bad=50.
- id: keccak_pe-multipass
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: pqc/keccak_pe
  configs: -DVX_CFG_EXT_PQC_ENABLE -DVX_CFG_SIMD_WIDTH=2
  args: -b 1 -t 4 -p 4
# Both extensions present; the AGU unit test exercises unlock backpressure.
- id: keccak_pe-rtu
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: pqc/keccak_pe
  configs: -DVX_CFG_EXT_PQC_ENABLE -DVX_CFG_EXT_RTU_ENABLE
  args: -b 4 -t 1 -p 4
# Three LSU scheduler clients (LSU + TCU metadata + engine). The round-robin
# pointer wrapped modulo 2**CLIENT_ID_BITS, so at three clients it could select
# client 3 of a three-entry array. Pre-fix: scoreboard timeout at VX_scoreboard.sv:226.
- id: keccak_pe-3client
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: pqc/keccak_pe
  configs: -DVX_CFG_EXT_PQC_ENABLE -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE
  args: -b 4 -t 1 -p 4

# --- check: model_parity — SimX vs rtlsim on the same app/args/configs ----
# The 8-warp timing difference remains under investigation; retain the 5% gate
# on the established 1/4-warp cases and functional coverage on the wider cases.
- id: model_parity-keccak_pe
  check: model_parity
  via: blackbox
  app: pqc/keccak_pe
  args: -b 1 -t 1 -p 8
- id: model_parity-keccak_pe-4warp
  check: model_parity
  via: blackbox
  app: pqc/keccak_pe
  args: -b 4 -t 1 -p 8

- id: keccak-unit
  via: script
  run: make -C hw/unittest/pqc_unit run
- id: agu-unit-4lane
  via: script
  run: make -C hw/unittest/pqc_unit run-agu MEM_LANES=4
- id: agu-unit-32lane
  via: script
  run: make -C hw/unittest/pqc_unit run-agu MEM_LANES=32
- id: rtu-only
  via: blackbox
  drivers: [rtlsim]
  app: rt_smoke
  configs: -DVX_CFG_EXT_RTU_ENABLE
  args: -n1

- id: keccak_pe-aved-target-smoke
  via: script
  configs: -DVX_CFG_EXT_PQC_ENABLE -DVX_CFG_NUM_WARPS=8 -DVX_CFG_NUM_THREADS=32
  run: ./ci/blackbox.sh --driver=aved --target=avedsim --app=pqc/keccak_pe --args="-b 1 -t 1 -p 1"
- id: keccak_pe-aved-target-full
  via: script
  configs: -DVX_CFG_EXT_PQC_ENABLE -DVX_CFG_NUM_WARPS=8 -DVX_CFG_NUM_THREADS=32
  run: ./ci/blackbox.sh --driver=aved --target=avedsim --app=pqc/keccak_pe --args="-b 8 -t 32 -p 4"
